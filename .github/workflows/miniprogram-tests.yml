name: Test Mini Program media flows

on:
  push:
    branches: [main, feature/wechat-miniprogram]
    paths:
      - 'miniprogram/**'
      - 'web/src/core/**'
      - 'web/package*.json'
      - '.github/workflows/miniprogram-tests.yml'
  pull_request:
    paths:
      - 'miniprogram/**'
      - 'web/src/core/**'
      - 'web/package*.json'
      - '.github/workflows/miniprogram-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install build dependencies
        run: npm ci --prefix web
      - name: Install media test engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check generated shared core
        run: node miniprogram/scripts/build-core.cjs --check
      - name: Test Mini Program flows and real media
        env:
          FFMPEG_EXE: ffmpeg
        run: node --test miniprogram/tests/*.test.cjs
      - name: Test Web shared behavior
        run: npm test --prefix web
